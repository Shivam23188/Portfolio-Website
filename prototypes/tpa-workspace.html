<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TPA Workspace — Dashboard</title>
  <meta name="description" content="TPA Workspace: transfer pricing allocation admin dashboard prototype." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="../assets/img/tpa-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tpa-workspace.css" />
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <div class="tpa">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand__tile">
          <svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 40 A14 14 0 0 1 35 40" fill="none" stroke="#1E2A4A" stroke-width="8"/><path d="M26 9 A9 9 0 0 0 44 9" fill="none" stroke="#E8613C" stroke-width="7"/></svg>
        </div>
        <div class="brand__text">
          <span class="brand__name">TPA</span>
          <span class="brand__sub">WORKSPACE</span>
        </div>
      </div>

      <nav class="side-nav" aria-label="Main">
        <span class="side-nav__label">OVERVIEW</span>

        <button class="nav-item" type="button" data-nav="dashboard" aria-current="page" title="Dashboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span class="nav-item__label">Dashboard</span>
        </button>

        <button class="nav-item" type="button" data-nav="home" title="Home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
          <span class="nav-item__label">Home</span>
        </button>

        <span class="side-nav__label side-nav__label--gap">MODULES</span>

        <!-- Admin group -->
        <button class="nav-item" type="button" aria-expanded="true" aria-controls="group-admin" data-group="admin" title="Admin">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.6a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.6a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="nav-item__label">Admin</span>
          <svg class="nav-item__chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>

        <div class="side-nav__group" id="group-admin">
          <button class="nav-item nav-item--sub" type="button" data-nav="urm">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 8.8-8.8"/><path d="m15.5 7.5 3 3"/><path d="m17.5 5.5 2 2"/></svg>
            <span class="nav-item__label">User Role Menu</span>
          </button>
          <button class="nav-item nav-item--sub" type="button" data-nav="role">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
            <span class="nav-item__label">Role Master</span>
          </button>
          <button class="nav-item nav-item--sub" type="button" data-nav="user">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/><path d="M22 21v-1a6 6 0 0 0-4-5.6"/></svg>
            <span class="nav-item__label">User Master</span>
          </button>
          <button class="nav-item nav-item--sub" type="button" data-nav="menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
            <span class="nav-item__label">Menu Master</span>
          </button>
          <button class="nav-item nav-item--sub" type="button" data-nav="urmm">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 8.8-8.8"/><path d="m15.5 7.5 3 3"/><path d="m17.5 5.5 2 2"/></svg>
            <span class="nav-item__label">User Role Menu Mapping</span>
          </button>
          <button class="nav-item nav-item--sub" type="button" data-nav="sublob">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/><path d="M22 21v-1a6 6 0 0 0-4-5.6"/></svg>
            <span class="nav-item__label">User SubLob Master</span>
          </button>
          <button class="nav-item nav-item--sub" type="button" data-nav="report">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/><path d="M22 21v-1a6 6 0 0 0-4-5.6"/></svg>
            <span class="nav-item__label">User ReportType Master</span>
          </button>
        </div>

        <!-- Masters (sub-menu not designed yet) -->
        <button class="nav-item" type="button" aria-expanded="false" title="Masters">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
          <span class="nav-item__label">Masters</span>
          <svg class="nav-item__chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>

        <!-- Transaction (sub-menu not designed yet) -->
        <button class="nav-item" type="button" aria-expanded="false" title="Transaction">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="nav-item__label">Transaction</span>
          <svg class="nav-item__chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </nav>

      <div class="side-hint">
        <span class="side-hint__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
        </span>
        <span class="side-hint__text">Hover to expand</span>
      </div>
    </aside>

    <!-- ============ Main ============ -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" type="button" data-sidebar-toggle aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h16"/></svg>
        </button>
        <span class="topbar__divider" aria-hidden="true"></span>
        <div class="topbar__title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <h1 data-page-title>Dashboard</h1>
        </div>

        <div class="topbar__actions">
          <button class="icon-btn icon-btn--round" type="button" aria-label="Notifications (unread)">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
            <span class="icon-btn__dot" aria-hidden="true"></span>
          </button>
          <span class="topbar__divider topbar__divider--tall" aria-hidden="true"></span>
          <button class="account" type="button" aria-label="Account menu">
            <span class="account__avatar">BA</span>
            <span class="account__meta">
              <span class="account__name">Ravi</span>
              <span class="account__role">Admin</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </header>

      <main class="content" id="content">
        <section class="welcome" aria-labelledby="welcome-title">
          <div class="welcome__rule" aria-hidden="true"></div>
          <svg class="welcome__watermark" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 40 A14 14 0 0 1 35 40" fill="none" stroke="#1E2A4A" stroke-width="8"/><path d="M26 9 A9 9 0 0 0 44 9" fill="none" stroke="#E8613C" stroke-width="7"/></svg>

          <div class="welcome__copy">
            <span class="pill" style="--i:0">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
              TRANSFER PRICING ALLOCATION
            </span>
            <h2 class="welcome__title" id="welcome-title" style="--i:1"><span data-greeting>Good Afternoon</span>, <em>Ravi</em></h2>
            <span class="signed-in" style="--i:2">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1E2A4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M3 13h18"/></svg>
              <span>Signed in as</span> <strong>ADMIN</strong>
            </span>
          </div>

          <div class="welcome__art" style="--i:3" aria-hidden="true">
            <div class="welcome__glow"></div>
            <div class="welcome__tile-back"></div>
            <div class="welcome__tile">
              <svg width="96" height="96" viewBox="0 0 48 48"><path d="M7 40 A14 14 0 0 1 35 40" fill="none" stroke="#1E2A4A" stroke-width="8"/><path d="M26 9 A9 9 0 0 0 44 9" fill="none" stroke="#E8613C" stroke-width="7"/></svg>
              <span>TPA WORKSPACE</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="scrim" data-scrim aria-hidden="true"></div>
  </div>

  <script src="../assets/js/tpa-workspace.js"></script>
</body>
</html>
